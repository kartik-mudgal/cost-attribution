# Deploy the AgentCore runtime when agent/deploy code lands on main.
# Required repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
name: Deploy AgentCore

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agentcore-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Idempotent: overwrites the inline policy; unchanged JSON is a no-op for permissions.
      - name: Apply runtime IAM role policy
        run: |
          aws iam put-role-policy \
            --role-name cost-agent-runtime-role \
            --policy-name runtime \
            --policy-document file://deploy/role-policy.json

      - name: Package and upload agent zip
        run: ./deploy/package.sh

      - name: Create or update AgentCore runtime
        run: uv run --with boto3 python deploy/deploy_runtime.py
